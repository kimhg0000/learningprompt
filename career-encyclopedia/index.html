<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>진로상담·진로심리 연구 백과사전</title><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><style>:root{--fg:#18212a;--muted:#65717d;--line:#dce2e7;--soft:#f6f8fa;--accent:#203864}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;line-height:1.72}main{max-width:960px;margin:auto;padding:28px 18px 80px}h1,h2,h3{color:var(--accent);line-height:1.35;margin-top:1.7em}h1{font-size:2rem;border-bottom:3px solid var(--accent);padding-bottom:.35em}h2{font-size:1.5rem;border-bottom:1px solid var(--line);padding-bottom:.25em}h3{font-size:1.18rem}p,li{font-size:1rem}table{border-collapse:collapse;width:100%;font-size:.9rem;margin:1.1em 0;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}th,td{border:1px solid var(--line);padding:.55em .65em;vertical-align:top;min-width:120px}th{background:var(--soft);text-align:left}blockquote{margin:1em 0;padding:.8em 1em;background:var(--soft);border-left:4px solid var(--accent)}code{background:var(--soft);padding:.1em .3em;border-radius:4px}hr{border:0;border-top:1px solid var(--line);margin:2em 0}.loading{display:grid;place-items:center;min-height:70vh;text-align:center;color:var(--accent)}.loading small{color:var(--muted)}.fallback{white-space:pre-wrap;word-break:break-word;font-family:inherit}@media(max-width:640px){main{padding:18px 14px 60px}h1{font-size:1.65rem}h2{font-size:1.3rem}table{font-size:.82rem}}</style></head><body><main id="app"><div class="loading"><div><h2>진로상담·진로심리 연구 백과사전</h2><p>문서를 불러오는 중입니다.</p><small>잠시 후 자동으로 열립니다.</small></div></div></main><script>(async()=>{const app=document.getElementById('app');try{const base='https://raw.githubusercontent.com/kimhg0000/learningprompt/main/career-encyclopedia/';const files=['chunk01.txt','chunk02.txt','chunk03.txt','chunk04.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(base+f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()}));const full=parts.join('');const doc=new DOMParser().parseFromString(full,'text/html');const pre=doc.querySelector('pre');const md=pre?pre.textContent:full;if(window.marked){app.innerHTML=marked.parse(md,{gfm:true,breaks:false});}else{app.className='fallback';app.textContent=md;}}catch(e){app.innerHTML='<div class="loading"><div><h2>문서를 불러오지 못했습니다.</h2><p>페이지를 새로고침해 주세요.</p><small>'+String(e)+'</small></div></div>'}})();</script></body></html>
