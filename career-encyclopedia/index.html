<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>진로상담·진로심리 연구 백과사전</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f6f8fa;color:#203864}.box{text-align:center;padding:28px}small{color:#697580}</style></head><body><div class="box"><h2>진로상담·진로심리 연구 백과사전</h2><p>문서를 불러오는 중입니다.</p><small>잠시 후 자동으로 열립니다.</small></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/kimhg0000/learningprompt/main/career-encyclopedia/';const files=['chunk01.txt','chunk02.txt','chunk03.txt','chunk04.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(base+f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()}));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div class="box"><h2>문서를 불러오지 못했습니다.</h2><p>페이지를 새로고침해 주세요.</p><small>'+String(e)+'</small></div>'}})();</script></body></html>
